<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>راسپینا | کنترل پروژه ساختمان</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#15171A">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="راسپینا">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#15171A; --panel:#1D2024; --panel-2:#22262B; --line:#2C3138;
    --ink:#EDEDEC; --ink-soft:#9198A0; --ink-faint:#5C636B;
    --amber:#E3A857; --amber-dim:#E3A85722;
    --teal:#4FD1C5; --teal-dim:#4FD1C522;
    --green:#5FAE7B; --green-dim:#5FAE7B22;
    --red:#E2685C; --red-dim:#E2685C22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overflow-x:hidden; max-width:100%;}
  body{ background:var(--bg); color:var(--ink); font-family:'Vazirmatn',sans-serif; min-height:100vh; padding-bottom:40px; }
  header{ background:linear-gradient(180deg,#1A1D21,#15171A); padding:18px 18px 22px; border-bottom:1px solid var(--line); }
  .head-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .head-left{ display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto; overflow:hidden; }
  header img.logo{ width:34px; height:34px; border-radius:8px; background:#fff; object-fit:contain; padding:3px; flex-shrink:0; }
  header h1{ margin:0; font-size:14px; font-weight:800; line-height:1.35; }
  header p{ margin:4px 0 0; font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-badge{ font-family:'JetBrains Mono',monospace; font-size:10px; padding:4px 9px; border-radius:20px; background:var(--amber-dim); color:var(--amber); white-space:nowrap; }
  .signout-btn{ background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:11px; padding:5px 10px; border-radius:7px; font-family:'Vazirmatn'; cursor:pointer; margin-inline-start:6px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 14px; }

  #splashScreen{ position:fixed; inset:0; z-index:999; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .35s ease; }
  #splashScreen.hide{ opacity:0; pointer-events:none; }
  #splashScreen img{ width:76px; height:76px; border-radius:18px; background:#fff; object-fit:contain; padding:8px; }
  #splashScreen .splash-title{ font-size:16px; font-weight:900; }
  #splashScreen .splash-spinner{ width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--teal); animation:splash-spin .8s linear infinite; }
  @keyframes splash-spin{ to{ transform:rotate(360deg); } }

  .center-screen{ min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px 20px; gap:14px; }
  .center-screen img{ width:70px; height:70px; border-radius:16px; background:#fff; padding:8px; }
  .center-screen h2{ margin:0; font-size:17px; }
  .center-screen p{ margin:0; font-size:13px; color:var(--ink-soft); max-width:320px; line-height:1.9; }

  .auth-input{ width:100%; max-width:320px; font-family:'Vazirmatn',sans-serif; font-size:14px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--panel-2); color:var(--ink); margin-bottom:10px; }
  .auth-btn{ width:100%; max-width:320px; background:var(--amber); color:#191300; border:none; padding:12px 20px; border-radius:10px; font-family:'Vazirmatn'; font-weight:700; font-size:14px; cursor:pointer; margin-top:6px; }
  .auth-btn:disabled{ opacity:.6; cursor:default; }
  .auth-error{ color:var(--red); font-size:12.5px; max-width:320px; line-height:1.8; margin-top:2px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:14px; padding:16px; }
  .btn-primary{ background:var(--amber); color:#191300; border:none; font-family:'Vazirmatn'; font-weight:700; font-size:13.5px; padding:12px 16px; border-radius:10px; cursor:pointer; }
  .sync-note{ text-align:center; font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin:14px 0 4px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .dot.off{ background:var(--red); }
</style>
</head>
<body>

<div id="splashScreen">
  <img src="./icon-192.png" alt="راسپینا">
  <div class="splash-title">راسپینا — کنترل پروژه</div>
  <div class="splash-spinner"></div>
</div>

<header>
  <div class="wrap">
    <div class="head-row">
      <div class="head-left">
        <img class="logo" src="./icon-192.png" alt="راسپینا">
        <div>
          <h1>کنترل پروژه ساختمان</h1>
          <p id="headerSub">راسپینا</p>
        </div>
      </div>
      <div id="headerRight" style="display:flex; align-items:center; gap:6px;"></div>
    </div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="center-screen">
    <span class="sync-note"><span class="dot" id="statusDot"></span><span id="syncNote">در حال اتصال…</span></span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>
<script src="./app.js"></script>

</body>
</html>
